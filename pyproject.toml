[project]
name = "chess_sim"
version = "1.11.0"
description = "MuJoCo framework for an SO-101 arm playing chess: sim-ready assets, scripted expert, datasets, policy evaluation"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.10",
    "mink>=1.3",
    "python-chess>=1.9",
    "numpy>=1.24",
    "opencv-python-headless==4.13.0.92",
    "scipy>=1.10",
    "trimesh>=4.0",
    "pillow>=9.0",
    "imageio[ffmpeg]>=2.30",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.setuptools]
packages = ["chess_sim", "chess_sim.labsim"]

[tool.setuptools.package-data]
chess_sim = ["assets/**/*", "calib/*.json"]

[tool.pytest.ini_options]
# Collect only the test tree.  Several tool scripts end with
# `raise SystemExit(main())` at module level (house style for CLI entry points),
# so a root-level `pytest` used to abort collection with INTERNALERROR as soon as
# it reached tools/.  The launcher already scoped to tests/; this makes a bare
# `pytest` behave the same way.
testpaths = ["tests"]
