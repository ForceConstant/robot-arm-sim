[project]
name = "chess_sim"
version = "1.2.5"
description = "MuJoCo framework for an SO-101 arm playing chess: sim-ready assets, scripted expert, datasets, policy evaluation"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.10",
    "mink>=1.3",
    "python-chess>=1.9",
    "numpy>=1.24",
    "scipy>=1.10",
    "trimesh>=4.0",
    "pillow>=9.0",
    "imageio[ffmpeg]>=2.30",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.setuptools]
packages = ["chess_sim", "robot_web"]

[tool.setuptools.package-data]
chess_sim = ["assets/**/*", "calib/*.json"]
robot_web = ["index.html"]
